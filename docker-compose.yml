services:
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  contas-db:
    image: postgres:16
    environment:
      POSTGRES_DB: contas
      POSTGRES_USER: contas
      POSTGRES_PASSWORD: ${CONTAS_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - contas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contas -d contas"]
      interval: 5s
      timeout: 3s
      retries: 10

  transferencias-db:
    image: postgres:16
    environment:
      POSTGRES_DB: transferencias
      POSTGRES_USER: transferencias
      POSTGRES_PASSWORD: ${TRANSFERENCIAS_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - transferencias-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transferencias -d transferencias"]
      interval: 5s
      timeout: 3s
      retries: 10

  notificacoes-db:
    image: postgres:16
    environment:
      POSTGRES_DB: notificacoes
      POSTGRES_USER: notificacoes
      POSTGRES_PASSWORD: ${NOTIFICACOES_DB_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - notificacoes-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notificacoes -d notificacoes"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build: ./auth
    environment:
      DATABASE_URL: postgres://auth:${AUTH_DB_PASSWORD}@auth-db:5432/auth
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/auth/saude || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth:
        condition: service_healthy

  # Estes três ficam desligados até o dono entregar o serviço.
  # Quando o seu estiver na main, apague a linha "profiles".
  contas:
    build: ./contas
    environment:
      DATABASE_URL: postgres://contas:${CONTAS_DB_PASSWORD}@contas-db:5432/contas
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      contas-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/contas/saude || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  transferencias:
    build: ./transferencias
    profiles: ["completo"]
    environment:
      DATABASE_URL: postgres://transferencias:${TRANSFERENCIAS_DB_PASSWORD}@transferencias-db:5432/transferencias
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      transferencias-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/transferencias/saude || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  notificacoes:
    build: ./notificacoes
    profiles: ["completo"]
    environment:
      DATABASE_URL: postgres://notificacoes:${NOTIFICACOES_DB_PASSWORD}@notificacoes-db:5432/notificacoes
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      notificacoes-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/notificacoes/saude || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auth-data:
  contas-data:
  transferencias-data:
  notificacoes-data:

events {}

http {
  # DNS interno do Docker. O valid=5s faz o nginx reconsultar os nomes,
  # o que vai ser necessário na etapa 5, quando tiver réplicas (--scale).
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # rotas de serviço para serviço nunca saem pelo nginx
    location /interno { return 404; }
    if ($request_uri ~* "^/+interno") { return 404; }

    # "set" + variável: o nginx sobe mesmo se algum serviço ainda não existir
    # (devolve 502 só naquela rota, em vez de nem ligar)
    #
    # Sem "/" no fim de propósito. Com "location /contas/", um pedido para
    # "/contas" (sem barra) ganha um 301 para "/contas/", e o navegador refaz
    # um POST redirecionado como GET: POST /contas e POST /transferencias quebravam.
    location /auth {
      set $alvo http://auth:3000;
      proxy_pass $alvo;
    }
    location /contas {
      set $alvo http://contas:3000;
      proxy_pass $alvo;
    }
    location /transferencias {
      set $alvo http://transferencias:3000;
      proxy_pass $alvo;
    }
    location /notificacoes {
      set $alvo http://notificacoes:3000;
      proxy_pass $alvo;
    }
  }
}